<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#7C5CFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Winter Arc 90</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FF; --surface:#FFFFFF; --surface2:#F7F6FD; --line:#ECE9F7;
  --text:#1B1636; --text2:#6E6A86; --text3:#A5A2B8;
  --pri:#7C5CFC; --pri2:#5B3FE0; --priSoft:#EFEBFF; --priSoft2:#E2DAFF;
  --orange:#FF8A3D; --orangeSoft:#FFF1E7; --green:#22C55E; --greenSoft:#E8F9EF;
  --blue:#3B82F6; --blueSoft:#EAF2FF; --red:#F43F5E; --redSoft:#FFE9EE;
  --sh:0 2px 6px rgba(40,24,120,.04),0 10px 28px -12px rgba(40,24,120,.14);
  --sh2:0 16px 40px -12px rgba(124,92,252,.55);
  --r:22px; --nav:78px;
}
:root[data-theme="dark"]{
  --bg:#0F0C1E; --surface:#1A1630; --surface2:#221D3D; --line:#2C2650;
  --text:#F2F0FF; --text2:#A9A4C7; --text3:#6D6891;
  --priSoft:#2A2250; --priSoft2:#35296A; --orangeSoft:#3A2618; --greenSoft:#15301F; --blueSoft:#172646; --redSoft:#3A1622;
  --sh:0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--pri);background:var(--surface)}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.125em}
img{display:block}

/* app shell */
.app{max-width:460px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
@media(min-width:600px){
  body{background:radial-gradient(900px 600px at 20% 0%,#E5DDFF,transparent 60%),radial-gradient(700px 500px at 100% 100%,#FFE6D6,transparent 60%),#EEEAFB;min-height:100vh}
  :root[data-theme="dark"] body{background:radial-gradient(900px 600px at 20% 0%,#261D52,transparent 60%),#0A0816}
  .app{margin:24px auto;min-height:calc(100vh - 48px);border-radius:36px;box-shadow:0 30px 80px -30px rgba(60,30,160,.35),0 0 0 8px rgba(255,255,255,.5);overflow:hidden}
  :root[data-theme="dark"] .app{box-shadow:0 30px 80px -30px #000,0 0 0 8px rgba(255,255,255,.04)}
}
.screen{display:none;padding:18px 18px calc(var(--nav) + 40px);animation:fade .35s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#A78BFA,var(--pri));display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 6px 16px -6px var(--pri)}
.hdr .hi{font-size:12.5px;color:var(--text2);font-weight:500}
.hdr .nm{font-size:17px;font-weight:800;letter-spacing:-.01em}
.hdr .sp{flex:1}
.rbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--sh);display:grid;place-items:center;font-size:19px;position:relative;color:var(--text)}
.rbtn .dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.back{display:flex;align-items:center;gap:12px;margin-bottom:16px}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sh h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sh a,.link{font-size:12.5px;font-weight:700;color:var(--pri);cursor:pointer;text-decoration:none}
.muted{color:var(--text2)}.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--priSoft);color:var(--pri)}
.chip.o{background:var(--orangeSoft);color:var(--orange)}.chip.g{background:var(--greenSoft);color:var(--green)}.chip.b{background:var(--blueSoft);color:var(--blue)}
.chip.w{background:rgba(255,255,255,.2);color:#fff}
.bubble{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* week strip */
.week{display:flex;gap:6px;justify-content:space-between}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:18px;background:var(--surface);box-shadow:var(--sh);transition:.2s}
.wd small{font-size:11px;color:var(--text3);font-weight:700}
.wd b{font-size:15px;font-weight:800}
.wd i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.wd.done i{background:var(--green)}.wd.part i{background:var(--orange)}
.wd.on{background:var(--pri);box-shadow:var(--sh2);color:#fff}
.wd.on small{color:rgba(255,255,255,.75)}
.wd.on i{background:#fff}
.wd.off{opacity:.35;pointer-events:none}
.wd.today:not(.on) b{color:var(--pri)}

/* hero */
.hero{margin-top:16px;border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#8B6CFF 0%,#6A45F5 55%,#5330E0 100%);box-shadow:var(--sh2)}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-80px}
.hero::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);left:-40px;bottom:-70px}
.hero .in{position:relative;z-index:1;display:flex;align-items:center;gap:16px}
.hero .lbl{font-size:12.5px;opacity:.85;font-weight:600}
.hero .big{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.03em}
.hero .sub{font-size:12.5px;opacity:.85;margin-top:4px}
.hbar{height:7px;border-radius:9px;background:rgba(255,255,255,.22);margin-top:16px;overflow:hidden;position:relative;z-index:1}
.hbar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .6s}
.hero .foot{display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;margin-top:7px;position:relative;z-index:1;font-weight:600}
.ringw{position:relative;flex:none}
.ringw .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800}

/* stat tiles */
.tile{border-radius:var(--r);padding:15px;background:var(--surface);box-shadow:var(--sh);position:relative;overflow:hidden;text-align:left;width:100%}
.tile .th{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13.5px}
.tile .tv{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.tile .tv small{font-size:12px;color:var(--text2);font-weight:600;margin-left:3px}
.tile.p{background:linear-gradient(145deg,#7C5CFC,#5B3FE0);color:#fff;box-shadow:var(--sh2)}
.tile.p small{color:rgba(255,255,255,.8)!important}
.glasses{display:flex;gap:3px;margin-top:10px;flex-wrap:wrap}
.glasses span{width:13px;height:18px;border-radius:3px 3px 5px 5px;border:1.8px solid #BFD6FF;position:relative;overflow:hidden}
.glasses span.on{background:linear-gradient(#7AB2FF,var(--blue));border-color:var(--blue)}
.addw{margin-top:10px;width:100%;padding:8px;border-radius:12px;background:var(--blueSoft);color:var(--blue);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:5px}

/* workout card */
.wcard{border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--sh)}
.wimg{height:170px;position:relative;background:linear-gradient(135deg,var(--priSoft),var(--orangeSoft));overflow:hidden}
.wimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wimg .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(20,10,60,.78))}
.wimg .cap{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
.wimg .cap b{font-size:20px;font-weight:800;display:block;letter-spacing:-.01em}
.wimg .tag{position:absolute;top:12px;left:12px}
.anim img:nth-of-type(2){animation:flip 2s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:700;font-size:14.5px;background:var(--pri);color:#fff;box-shadow:var(--sh2);width:100%;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--priSoft);color:var(--pri);box-shadow:none}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:none}
.btn.danger{background:var(--redSoft);color:var(--red);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:13px;border-radius:13px;width:auto}

/* habits */
.hl{display:flex;flex-direction:column;gap:9px}
.hab{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:18px;background:var(--surface);box-shadow:var(--sh);text-align:left;width:100%;transition:.2s}
.hab .t{flex:1;font-weight:700;font-size:14px}
.hab .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:15px;transition:.25s}
.hab.on .ck{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.05)}
.hab.on .t{color:var(--text2);text-decoration:line-through;text-decoration-color:var(--text3)}
.hab:active{transform:scale(.98)}
.pbar{height:8px;border-radius:9px;background:var(--priSoft);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#A78BFA,var(--pri));transition:width .5s}

/* meals */
.meal{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border:0;padding-bottom:2px}
.meal .mt0{font-size:11.5px;color:var(--text3);font-weight:700}
.meal .mn{font-weight:700;font-size:13.5px}
.meal .md{font-size:12.5px;color:var(--text2);line-height:1.35}
.meal .pc{font-size:12px;font-weight:800;color:var(--orange);white-space:nowrap}
.cb{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:.2s}
.cb.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* explore */
.ex4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ex4 button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:700}
.ex4 .bubble{width:56px;height:56px;border-radius:18px;font-size:23px;background:var(--surface);box-shadow:var(--sh)}

/* exercise list */
.exi{display:flex;gap:12px;padding:10px;border-radius:20px;background:var(--surface);box-shadow:var(--sh);align-items:center;transition:.2s}
.exi.done{box-shadow:0 0 0 2px var(--green),var(--sh)}
.thumb{width:78px;height:78px;border-radius:16px;overflow:hidden;position:relative;flex:none;background:var(--priSoft);display:grid;place-items:center;color:var(--pri);font-size:28px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exi .nm{font-weight:800;font-size:14.5px;line-height:1.25}
.exi .meta{font-size:12px;color:var(--text2);margin-top:3px;font-weight:500}
.sets{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.set{width:30px;height:30px;border-radius:10px;background:var(--surface2);border:1.5px solid var(--line);font-size:12px;font-weight:800;color:var(--text3);transition:.15s}
.set.on{background:var(--green);border-color:var(--green);color:#fff}
.go{width:34px;height:34px;border-radius:50%;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;font-size:16px;flex:none}
.wu{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.wu:last-child{border:0}
.wu .thumb{width:46px;height:46px;border-radius:12px;font-size:18px}
.wu .n{flex:1;font-weight:700;font-size:13.5px}
.wu .r{font-size:12px;color:var(--text2);font-weight:600}
details.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .chev{margin-left:auto;transition:.2s;color:var(--text3)}
details.acc[open]>summary .chev{transform:rotate(180deg)}
.whead{border-radius:26px;overflow:hidden;position:relative;height:230px;background:linear-gradient(135deg,#8B6CFF,#5330E0);box-shadow:var(--sh2)}
.whead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.whead .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,20,120,.1),rgba(30,12,90,.85))}
.whead .cap{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.whead .cap h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats3 div{background:var(--surface);box-shadow:var(--sh);border-radius:18px;padding:12px;text-align:center}
.stats3 b{display:block;font-size:18px;font-weight:800}
.stats3 small{font-size:11px;color:var(--text2);font-weight:600}
.seg{display:flex;background:var(--surface);box-shadow:var(--sh);border-radius:16px;padding:5px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:9px 12px;border-radius:12px;font-weight:700;font-size:13px;color:var(--text2);white-space:nowrap}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 6px 14px -6px var(--pri)}

/* stats */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b{width:100%;max-width:30px;border-radius:10px 10px 6px 6px;background:var(--priSoft);position:relative;overflow:hidden;height:100%}
.bars .b i{position:absolute;left:0;right:0;bottom:0;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,#A78BFA,var(--pri));transition:height .6s}
.bars .b.t i{background:linear-gradient(180deg,#FFB27A,var(--orange))}
.bars small{font-size:11px;color:var(--text3);font-weight:700}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}
.cell{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:var(--surface2);color:var(--text3)}
.cell.l1{background:#E4DCFF;color:#6E55D6}.cell.l2{background:#BBA8FF;color:#fff}.cell.l3{background:#8B6CFF;color:#fff}.cell.l4{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff}
:root[data-theme="dark"] .cell.l1{background:#35296A;color:#C4B5FD}
.cell.today{box-shadow:0 0 0 2px var(--orange)}
.cell.fut{opacity:.45}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--text2);font-weight:600}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.hrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.hrow .bubble{width:32px;height:32px;border-radius:10px;font-size:15px}
.hrow .n{width:120px;font-size:12.5px;font-weight:700;flex:none}
.hrow .pbar{flex:1}
.hrow .v{width:38px;text-align:right;font-size:12px;font-weight:800;color:var(--text2)}
canvas.chart{width:100%;height:190px;display:block;margin-top:8px}

/* lists / tables */
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .n{flex:1;font-weight:700;font-size:13.5px}
.li .d{font-size:12.5px;color:var(--text2);font-weight:500}
.li .v{font-weight:800;font-size:13px}
.tl{position:relative;padding-left:4px}
.tlr{display:flex;gap:12px;align-items:center;padding:8px 0;position:relative}
.tlr .time{width:46px;font-size:12px;font-weight:800;color:var(--text2)}
.tlr .bubble{width:36px;height:36px;border-radius:12px;font-size:16px;background:var(--priSoft);color:var(--pri)}
.tlr.now .bubble{background:var(--pri);color:#fff;box-shadow:0 6px 14px -6px var(--pri)}
.tlr.now .n{color:var(--pri)}
.tlr .n{font-weight:700;font-size:13.5px}
.bul li{margin:8px 0 0 18px;font-size:13.5px}
.split{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.split div{background:var(--surface2);border-radius:12px;padding:8px 3px;text-align:center;font-size:10.5px;font-weight:700;line-height:1.25}
.split div small{display:block;color:var(--text3);font-size:10px;margin-bottom:3px}
.split div.r{background:var(--greenSoft);color:var(--green)}.split div.a{background:var(--blueSoft);color:var(--blue)}
.daychips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.daychips button{padding:8px 13px;border-radius:12px;background:var(--surface);box-shadow:var(--sh);font-weight:700;font-size:12.5px}
.daychips button.on{background:var(--pri);color:#fff}
.quote{border-radius:var(--r);padding:18px;background:linear-gradient(135deg,var(--orangeSoft),var(--priSoft));position:relative}
.quote b{font-size:15.5px;font-weight:800;line-height:1.4;display:block;margin-top:6px}
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;padding:10px 0;border-radius:14px;background:var(--surface2);font-size:22px;filter:grayscale(1);opacity:.6;transition:.2s}
.moods button.on{filter:none;opacity:1;background:var(--priSoft);box-shadow:0 0 0 2px var(--pri)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--text2)}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;height:var(--nav);background:var(--surface);box-shadow:0 -8px 30px -12px rgba(40,24,120,.18);display:flex;align-items:center;justify-content:space-around;padding:0 8px env(safe-area-inset-bottom);z-index:40;border-radius:26px 26px 0 0}
@media(min-width:600px){.nav{bottom:24px;border-radius:26px 26px 36px 36px}}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--text3);width:62px;transition:.2s}
.nav button svg{font-size:22px}
.nav button.on{color:var(--pri)}
.nav button.on svg{stroke-width:2.4}
.fab{width:58px!important;height:58px;border-radius:50%;background:linear-gradient(135deg,#9272FF,var(--pri2))!important;color:#fff!important;box-shadow:var(--sh2);margin-top:-34px;display:grid!important;place-items:center;font-size:26px!important;border:5px solid var(--bg)!important}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,12,50,.45);backdrop-filter:blur(3px);z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px 26px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.big-anim{height:240px;border-radius:22px;overflow:hidden;position:relative;background:var(--priSoft);display:grid;place-items:center;color:var(--pri);font-size:60px}
.big-anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.steps li{list-style:none;display:flex;gap:10px;margin-top:10px;font-size:13.5px}
.steps li b{width:24px;height:24px;border-radius:8px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;font-size:12px;flex:none}
.tipbox{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--orangeSoft);color:#B4541A;font-size:13px;font-weight:600;display:flex;gap:8px}
:root[data-theme="dark"] .tipbox{color:#FFB27A}

/* timer / toast */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 14px);z-index:50;display:none;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:22px;background:#1B1636;color:#fff;box-shadow:0 20px 40px -12px rgba(0,0,0,.5)}
.timer.on{display:flex;animation:up .3s}
.timer b{font-size:26px;font-weight:800;min-width:58px;font-variant-numeric:tabular-nums}
.timer button{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 11px;font-weight:700;font-size:12px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-130px);background:#1B1636;color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:13.5px;z-index:90;transition:.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 14px 30px -10px rgba(0,0,0,.4);max-width:90vw;opacity:0;visibility:hidden}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
.banner{border-radius:18px;padding:14px;background:var(--orangeSoft);color:#B4541A;font-weight:700;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:14px}
:root[data-theme="dark"] .banner{color:#FFB27A}
.notes{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--priSoft);color:var(--pri2);font-size:12.5px;font-weight:600}
:root[data-theme="dark"] .note{color:#C4B5FD}
@media(max-width:360px){.ex4 .bubble{width:48px;height:48px}.hero .big{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const KEY = "winterArc90_v1";

function rec(n){ const r = S.days[n] ||= {}; r.h ||= {}; r.ex ||= {}; r.lw ||= {}; r.wu ||= {}; r.cd ||= {}; r.meals ||= {}; r.water ||= 0; return r; }

/* ---------- dates / plan ---------- */
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const dateOf = n => { const d=pd(S.start); d.setDate(d.getDate()+n-1); return d; };
function todayN(){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((t-pd(S.start))/864e5)+1; }
const clamp = n => Math.min(90, Math.max(1, n));
let cur = clamp(todayN());
function plan(n){ const d=dateOf(n), wd=WDS[d.getDay()], ph=n<=30?1:n<=60?2:3;
  const key=DATA.phases[ph-1].split[wd];
  return {n, ph, wd, key, w:DATA.workouts[key], meal:DATA.meals[(d.getDay()+6)%7], notes:DATA.days[n-1].notes, q:DATA.days[n-1].q,
          skin:DATA.skinWeekly.filter(x=>x[0]===wd).map(x=>x[1])}; }
const score = n => { const r=S.days[n]; return r&&r.h ? HK.filter(k=>r.h[k]).length/HK.length : 0; };
const fmtLong = d => d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"});
const imgU = (id, f=0) => DATA.img + id + "/" + f + ".jpg";
function photo(id, fallbackIcon="dumbbell", anim=true){

         (anim?`<img src="${imgU(id,1)}" alt="" loading="lazy" style="animation:flip 2s steps(1) infinite" onerror="this.remove()">`:"");
}
function proteinOf(n){ const r=rec(n), p=plan(n); const fromMeals=p.meal.m.reduce((a,m,i)=>a+(r.meals[i]?m[3]:0),0);
  return r.prot!==undefined && r.prot!=="" ? +r.prot : fromMeals; }
function streaks(){ const t=Math.min(90,todayN()); let c=0,b=0,run=0;
  for(let n=1;n<=t;n++){ if(score(n)>=.8){run++;b=Math.max(b,run);} else run=0; }
  for(let n=t;n>=1;n--){ if(score(n)>=.8) c++; else if(n===t) continue; else break; } return {c,b}; }
function ring(p, size=96, sw=9, col="#fff", track="rgba(255,255,255,.22)"){
  const r=(size-sw)/2, C=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,p))}" style="transition:stroke-dashoffset .7s"/></svg>`; }

/* ---------- HOME ---------- */
R.home = function(){

  <div class="sh"><h2>Health summary</h2><a onclick="openLog()">+ Log</a></div>

function chart(pts){ const c=$("#wc"); if(!c) return; const dpr=devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight; c.width=w*dpr; c.height=h*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr); const cs=getComputedStyle(document.documentElement), mut=cs.getPropertyValue("--text3").trim(), ln=cs.getPropertyValue("--line").trim();
  x.font="600 11px 'Plus Jakarta Sans',system-ui,sans-serif"; x.fillStyle=mut;
  if(pts.length<2){ x.textAlign="center"; x.fillText("Log weight on 2+ days to see the trend",w/2,h/2); return; }
  const v=pts.map(p=>p[1]), mn=Math.min(...v)-1, mx=Math.max(...v)+1, P={l:34,r:8,t:12,b:20};
  const X=n=>P.l+(n-1)/89*(w-P.l-P.r), Y=val=>P.t+(mx-val)/(mx-mn)*(h-P.t-P.b);
  x.strokeStyle=ln; x.setLineDash([3,4]);
  for(let i=0;i<=3;i++){ const val=mn+(mx-mn)*i/3,y=Y(val); x.beginPath(); x.moveTo(P.l,y); x.lineTo(w-P.r,y); x.stroke(); x.textAlign="right"; x.fillText(val.toFixed(1),P.l-6,y+4); }
  x.setLineDash([]); x.textAlign="center"; [1,30,60,90].forEach(n=>x.fillText("D"+n,X(n),h-4));
  const avg=pts.map(p=>{const q=pts.filter(z=>z[0]>p[0]-7&&z[0]<=p[0]);return [p[0],q.reduce((a,b)=>a+b[1],0)/q.length]});
  const g=x.createLinearGradient(0,P.t,0,h-P.b); g.addColorStop(0,"rgba(124,92,252,.28)"); g.addColorStop(1,"rgba(124,92,252,0)");
  x.beginPath(); avg.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1]))); x.lineTo(X(avg.at(-1)[0]),h-P.b); x.lineTo(X(avg[0][0]),h-P.b); x.fillStyle=g; x.fill();
  x.beginPath(); avg.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1]))); x.strokeStyle="#7C5CFC"; x.lineWidth=3; x.lineJoin="round"; x.stroke();
  pts.forEach(p=>{ x.beginPath(); x.arc(X(p[0]),Y(p[1]),3.5,0,7); x.fillStyle="#FF8A3D"; x.fill(); });
}

    ${DATA.tips.map(x=>`<details class="card acc" style="margin-bottom:10px"><summary><span class="bubble" style="background:var(--priSoft);color:var(--pri)">${ic(x[1])}</span><b>${esc(x[0])}</b><span class="chev">${ic("chevron-down")}</span></summary><p class="muted" style="margin-top:10px;font-size:13.5px">${esc(x[2])}</p></details>`).join("")}`; }
  if(UI.more==="glow"){ body=`
    <div class="hero" style="background:linear-gradient(135deg,#F472B6,#C04AE0 60%,#7C5CFC)"><div class="lbl">Face glow on a budget</div><div class="big" style="font-size:30px">₹400–600<span style="font-size:15px"> / month</span></div><div class="sub">5 minutes a day · simple products</div></div>
    <div class="sh"><h2>Morning · 3 min</h2><span class="chip o">${ic("sun")} AM</span></div>
    <div class="card">${DATA.skinAM.map((x,i)=>`<div class="li"><span class="bubble" style="background:var(--orangeSoft);color:var(--orange)">${ic(x[2])}</span><span class="n">${i+1}. ${esc(x[0])}<div class="d">${esc(x[1])}</div></span></div>`).join("")}</div>
    <div class="sh"><h2>Night · 2 min</h2><span class="chip">${ic("moon")} PM</span></div>
    <div class="card">${DATA.skinPM.map((x,i)=>`<div class="li"><span class="bubble" style="background:var(--priSoft);color:var(--pri)">${ic(x[2])}</span><span class="n">${i+1}. ${esc(x[0])}<div class="d">${esc(x[1])}</div></span></div>`).join("")}</div>
    <div class="sh"><h2>Weekly</h2></div><div class="card">${DATA.skinWeekly.map(x=>`<div class="li"><span class="chip">${x[0]}</span><span class="n" style="font-weight:600">${esc(x[1])}</span></div>`).join("")}</div>
    <div class="sh"><h2>Budget</h2></div><div class="card">${DATA.skinBudget.map(x=>`<div class="li"><span class="n">${esc(x[0])}<div class="d">lasts ${esc(x[2])}</div></span><span class="v">${esc(x[1])}</span></div>`).join("")}</div>
    <div class="sh"><h2>Glow from inside</h2></div><div class="card"><ul class="bul" style="margin-top:-6px">${DATA.skinLife.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="sh"><h2 style="color:var(--red)">Don't do this</h2></div><div class="card"><ul class="bul" style="margin-top:-6px">${DATA.skinDonts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <div class="tipbox">${ic("info","font-size:17px")}<span>Start niacinamide every other day for 2 weeks. Patch-test new products.</span></div></div>`; }
  if(UI.more==="plan"){ body=`
    <div class="card mt"><b style="font-size:15px">Your 90-day journey</b><p class="small muted" style="margin-top:4px">1 Oct → 29 Dec 2026 · 154 cm · ~70 kg · home workout (no bench)</p>
    <div class="stats3" style="margin-top:12px"><div><b style="color:var(--pri)">1850</b><small>kcal/day</small></div><div><b style="color:var(--orange)">110g</b><small>protein</small></div><div><b style="color:var(--green)">10k</b><small>steps</small></div></div></div>
    ${DATA.phases.map(ph=>`<div class="card mt"><div class="row"><span class="bubble" style="background:var(--priSoft);color:var(--pri);font-weight:800">${ph.n}</span><div><b>${esc(ph.name)}</b><div class="small muted">Day ${ph.days[0]}–${ph.days[1]}</div></div></div><p class="small muted" style="margin-top:8px">${esc(ph.desc)}</p>
      <div class="split">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>{const wk=DATA.workouts[ph.split[d]];return `<div class="${wk.type==="rest"?"r":wk.type==="active"?"a":""}"><small>${d}</small>${esc(wk.title.replace("Full Body ","FB ").replace(" Day",""))}</div>`}).join("")}</div></div>`).join("")}
    <div class="card mt"><div class="row"><span class="bubble" style="background:var(--greenSoft);color:var(--green)">${ic("target")}</span><b>Realistic results in 90 days</b></div>
      <ul class="bul"><li>Fat loss: ~5–7 kg</li><li>Waist: ~5–8 cm smaller</li><li>Clearly stronger on all lifts</li><li>Clearer, less puffy face</li><li>Biggest win: you kept your word for 90 days</li></ul></div>
    <div class="note mt">${ic("heart-pulse","font-size:16px;margin-top:1px")}<div>"No rest days" = habits never stop. Weights get 1 rest + 2 active recovery days a week — muscles grow while resting.</div></div>`; }
  if(UI.more==="settings"){ let kb="?"; try{kb=((localStorage.getItem(KEY)||"").length/1024).toFixed(1);}catch(e){}
    body=`<div class="card mt"><label class="field">Your name<input id="nmIn" value="${esc(S.name)}" placeholder="Your name"></label>
      <label class="field mt">Start date<input type="date" id="sdIn" value="${S.start}"></label>
      <button class="btn mt" onclick="saveSettings()">${ic("save")} Save</button></div>
    <div class="card mt"><div class="li" style="padding-top:0"><span class="bubble" style="background:var(--priSoft);color:var(--pri)">${ic(S.theme==="dark"?"moon":"sun")}</span><span class="n">Dark mode</span>
      <button class="btn sm ${S.theme==="dark"?"":"soft"}" onclick="S.theme=S.theme==='dark'?'light':'dark';applyTheme();save();R.more()">${S.theme==="dark"?"On":"Off"}</button></div>
      <div class="li"><span class="bubble" style="background:var(--greenSoft);color:var(--green)">${ic("download")}</span><span class="n">Backup data<div class="d">Saved on this phone only (${kb} KB)</div></span><button class="btn sm soft" onclick="exportData()">Export</button></div>
      <div class="li"><span class="bubble" style="background:var(--blueSoft);color:var(--blue)">${ic("upload")}</span><span class="n">Restore backup</span><label class="btn sm soft" style="cursor:pointer">Import<input type="file" accept=".json" hidden onchange="importData(this)"></label></div>
      <div class="li" style="padding-bottom:0"><span class="bubble" style="background:var(--redSoft);color:var(--red)">${ic("trash-2")}</span><span class="n">Reset everything</span><button class="btn sm danger" onclick="resetAll()">Reset</button></div></div>
    <p class="small muted mt" style="text-align:center">Exercise photos: free-exercise-db (public domain) · Icons: Lucide</p>`; }
  $("#s-more").innerHTML = `<div class="back"><button class="rbtn" onclick="go('home')" aria-label="Back">${ic("arrow-left")}</button><div class="title">${tabs.find(t=>t[0]===UI.more)[1]}</div></div>
    <div class="seg">${tabs.map(t=>`<button class="${UI.more===t[0]?"on":""}" onclick="UI.more='${t[0]}';R.more()">${t[1]}</button>`).join("")}</div>${body}`;
};
function saveSettings(){ S.name=$("#nmIn").value.trim(); const v=$("#sdIn").value; if(v) S.start=v; save(); cur=clamp(todayN()); toast("Saved ✓"); }
function exportData(){ const b=new Blob([JSON.stringify(S)],{type:"application/json"}), a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`winter-arc-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); toast("Backup downloaded ✓"); }
function importData(inp){ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.days) throw 0; S=d; save(); applyTheme(); cur=clamp(todayN()); toast("Data restored ✓"); go("home"); }catch(e){ toast("Wrong file ✕"); } }; rd.readAsText(f); }
function resetAll(){ if(!confirm("Delete all progress? This can't be undone.")) return; try{localStorage.removeItem(KEY);}catch(e){} load(); applyTheme(); cur=clamp(todayN()); toast("Reset done"); go("home"); }

/* ---------- quick log ---------- */
function openLog(focus){ const r=rec(cur);
  $("#sheet").innerHTML = `<div class="grab"></div><div class="row" style="justify-content:space-between"><div><div class="title" style="font-size:20px">Quick log</div><div class="small muted">Day ${cur} · ${fmtLong(dateOf(cur))}</div></div><button class="rbtn" onclick="closeSheet()">${ic("x")}</button></div>
    <div class="grid2 mt2"><label class="field"><span>${ic("scale")} Weight (kg)</span><input id="l-wt" type="number" step="0.1" inputmode="decimal" value="${esc(r.wt)}" placeholder="70.0"></label>
    <label class="field"><span>${ic("footprints")} Steps</span><input id="l-steps" type="number" inputmode="numeric" value="${esc(r.steps)}" placeholder="10000"></label>
    <label class="field"><span>${ic("egg")} Protein (g)</span><input id="l-prot" type="number" inputmode="numeric" value="${esc(r.prot)}" placeholder="auto from meals"></label>
    <label class="field"><span>${ic("book-open")} Pages read</span><input id="l-pages" type="number" inputmode="numeric" value="${esc(r.pages)}" placeholder="10"></label></div>
    <div class="field mt"><span>${ic("droplets")} Water</span></div><div class="row" style="margin-top:6px"><button class="rbtn" onclick="addWater(-1);openLog()">${ic("minus")}</button><b style="flex:1;text-align:center;font-size:20px">${(r.water*.25).toFixed(2)} L</b><button class="rbtn" style="background:var(--blue);color:#fff" onclick="addWater(1);openLog()">${ic("plus")}</button></div>
    <div class="field mt">How do you feel?</div><div class="moods" style="margin-top:6px">${["😫","😕","😐","🙂","🔥"].map((m,i)=>`<button class="${r.mood===i?"on":""}" onclick="rec(cur).mood=${i};save();openLog()">${m}</button>`).join("")}</div>
    <label class="field mt">Notes<textarea id="l-note" rows="2" placeholder="How was today?">${esc(r.note)}</textarea></label>
    <button class="btn mt2" onclick="saveLog()">${ic("check")} Save</button>`;
  $("#ov").classList.add("on"); if(focus) setTimeout(()=>$("#l-"+focus)?.focus(),250); }
function saveLog(){ const r=rec(cur); ["wt","steps","prot","pages"].forEach(k=>r[k]=$("#l-"+k).value); r.note=$("#l-note").value;
  const msgs=[]; if(+r.steps>=10000&&!r.h.steps){r.h.steps=true;msgs.push("10k steps ✓");} if(proteinOf(cur)>=110&&!r.h.protein){r.h.protein=true;msgs.push("Protein ✓");} if(+r.pages>=10&&!r.h.read){r.h.read=true;msgs.push("Reading ✓");}
  save(); closeSheet(); toast(msgs.length?msgs.join(" · "):"Saved ✓"); if(score(cur)===1) confetti(); rerender(); }

/* ---------- timer ---------- */
let tl=0, ti=null, ac=null;
function beep(f=880,d=.15){ try{ ac ||= new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.2,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d); o.start(); o.stop(ac.currentTime+d);}catch(e){} }
function startTimer(s){ tl=s; $("#timer").classList.add("on"); tick(); clearInterval(ti); ti=setInterval(()=>{ tl--; tick(); if(tl<=3&&tl>0) beep(660,.08); if(tl<=0){ beep(990,.35); navigator.vibrate&&navigator.vibrate([200,100,200]); stopTimer(); toast("Rest over — next set! 💪"); } },1000); }
function tick(){ const m=Math.floor(tl/60), s=tl%60; $("#tval").textContent = m?`${m}:${String(s).padStart(2,"0")}`:s; }
function addTime(s){ tl+=s; tick(); } function stopTimer(){ clearInterval(ti); $("#timer").classList.remove("on"); }

/* ---------- misc ---------- */
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("on"),2300); }
function applyTheme(){ document.documentElement.dataset.theme=S.theme; }
function confetti(){ const c=$("#confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#7C5CFC","#A78BFA","#FF8A3D","#22C55E","#3B82F6","#F472B6"];
  const ps=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,s:Math.random()*7+4,c:cols[Math.random()*6|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0; (function a(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();}); if(++f<160) requestAnimationFrame(a); else x.clearRect(0,0,c.width,c.height); })(); }
addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
applyTheme(); R.home();
</script>
</body>
